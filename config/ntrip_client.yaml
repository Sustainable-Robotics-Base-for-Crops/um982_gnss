/**:
  ros__parameters:
    authenticate: False
    host: crtk.net
    mountpoint: NEAR
    port: 2101
    # Reconnect when no complete and valid RTCM frame is received during this interval.
    rtcm_timeout_seconds: 15.0
    # Retry policy: five-second retries, then a two-minute pause after five failures.
    reconnect_attempt_max: 5
    reconnect_attempt_wait_seconds: 5.0
    reconnect_pause: 120.0
